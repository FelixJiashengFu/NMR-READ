name: CI & Wasm Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test-native:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GTK dependencies for rfd
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev
      - name: Run workspace unit tests
        run: cargo test --workspace
      - name: Check CLI benchmark
        run: cargo run -p nmr-read-cli -- benchmark --preset ethanol --points 1024 --noise 0.2

  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check wasm32-unknown-unknown compilation
        run: cargo check -p nmr-read-gui --target wasm32-unknown-unknown --bin nmr-read-gui
      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.0
      - name: Build Wasm bundle
        run: trunk build --release --public-url "/NMR-READ/"
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test-native, build-wasm]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
