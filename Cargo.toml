[workspace]
resolver = "2"
members = [
    "crates/nmr-core",
    "crates/nmr-io",
    "crates/nmr-dsp",
    "crates/nmr-read-cli",
    "crates/nmr-read-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Jiasheng Fu <https://github.com/FelixJiashengFu>"]
repository = "https://github.com/FelixJiashengFu/NMR-READ"

[workspace.dependencies]
num-complex = { version = "0.4.6", features = ["serde"] }
rustfft = "6.4.1"
faer = { version = "0.24.4", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0"
quick-xml = "0.42.0"
base64 = "0.23.1"
zip = { version = "9.8.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
clap = { version = "4.6.9", features = ["derive"] }

# GUI stack (egui 0.36 compatible)
eframe = { version = "0.36.0", default-features = false, features = ["default_fonts", "glow", "persistence", "x11", "wayland"] }
egui = "0.36.0"
egui_plot = "0.37.0"
egui-snarl = { version = "0.12.0", features = ["serde"] }
rfd = "0.18.0"

[profile.release]
opt-level = 3
lto = "thin"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
